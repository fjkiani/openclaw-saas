# Railway/Nixpacks build config
# NODE_ENV must not be "production" during install or pnpm skips devDependencies.
# typecheck:libs is omitted — tsc is a devDep and this is a deploy build, not CI.
[phases.install]
cmds = ["NODE_ENV=development pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @workspace/api-server run build"]

[start]
cmd = "node artifacts/api-server/dist/index.mjs"
