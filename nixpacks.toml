# Railway/Nixpacks build config
# - Skips typecheck (CI gate only; tsc not on PATH in Railway build env)
# - Uses --no-frozen-lockfile to handle pnpm version differences
[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @workspace/api-server run build"]

[start]
cmd = "node artifacts/api-server/dist/index.mjs"
