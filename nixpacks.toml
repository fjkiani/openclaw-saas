# Railway/Nixpacks build config — overrides auto-detected pnpm install step
# to avoid lockfile version mismatch between Nixpacks pnpm and repo pnpm.
[phases.install]
cmds = ["npm install -g pnpm@latest && pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["pnpm run typecheck:libs && pnpm --filter @workspace/api-server run build"]

[start]
cmd = "node artifacts/api-server/dist/index.mjs"
