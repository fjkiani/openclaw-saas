services:
  - type: web
    name: openclaw-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm run typecheck:libs && pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: openclaw-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_OWNER_ID
        sync: false
      - key: BENCHMARK_SERVICE_URL
        value: https://openclaw-benchmark.onrender.com
      - key: BENCHMARK_GATE_ENABLED
        value: "true"

  - type: web
    name: openclaw-saas
    runtime: static
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/openclaw-saas run build
    staticPublishPath: artifacts/openclaw-saas/dist
    envVars:
      - key: VITE_ZOA_SERVICE_URL
        value: https://openclaw-benchmark.onrender.com/api/v1/zoa
    headers:
      - path: /*
        name: Cache-Control
        value: no-store
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: openclaw-db
    plan: free
    region: oregon
