services:
  - type: web
    name: openclaw-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm run typecheck:libs && pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: openclaw-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_OWNER_ID
        sync: false
      - key: BENCHMARK_SERVICE_URL
        value: https://openclaw-benchmark.onrender.com
      - key: BENCHMARK_GATE_ENABLED
        value: "true"

  - type: web
    name: openclaw-saas
    runtime: static
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/openclaw-saas run build
    staticPublishPath: artifacts/openclaw-saas/dist/public
    envVars:
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_URL
        value: https://openclaw-api.onrender.com
      - key: VITE_ZOA_SERVICE_URL
        value: https://openclaw-benchmark.onrender.com/api/v1/zoa
      - key: VITE_ARCHON_FACTORY_URL
        value: https://archon-factory.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-store
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: openclaw-benchmark
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    rootDir: backend
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: openclaw-db
          property: connectionString

  - type: web
    name: archon-factory
    runtime: node
    region: oregon
    plan: starter
    buildCommand: pnpm install && pnpm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    rootDir: packages/archon-factory
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3002"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BENCHMARK_SERVICE_URL
        value: https://openclaw-benchmark.onrender.com
      - key: OPENCLAW_API_URL
        value: https://openclaw-api.onrender.com
      - key: ARCHON_SERVER_URL
        value: https://archon-zeta.onrender.com

databases:
  - name: openclaw-db
    plan: free
    region: oregon
