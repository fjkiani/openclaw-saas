services:
  - type: web
    name: openclaw-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm run typecheck:libs && pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: zeta-caid-prod
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_OWNER_ID
        sync: false
      # AUDIT (Sprint A, 2026-07): openclaw-benchmark FastAPI is NOT deployed.
      # benchmarkClient.ts reachability-probes before calling; keeping these
      # here so wiring is unambiguous if the service is later restored.
      - key: BENCHMARK_SERVICE_URL
        value: https://openclaw-benchmark.onrender.com
      # Gate defaults to false while the external FastAPI is offline; flip to
      # "true" once the service is deployed and probed reachable.
      - key: BENCHMARK_GATE_ENABLED
        value: "false"
      - key: KAIROS_SERVICE_URL
        value: https://openclaw-benchmark.onrender.com
      # Agent Robustness corpus location (optional override). Default is
      # <artifacts/api-server>/corpus/stress-benchmarks (baked into the build).
      # - key: STRESS_CORPUS_DIR
      #   value: /var/data/stress-benchmarks
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY_2
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: DRY_RUN
        value: "true"
      - key: OPENCLAW_SERVICE_TOKEN
        sync: false
      # CORS: set to the exact URL of the openclaw-saas static site on Render
      - key: FRONTEND_URL
        value: https://openclaw-lfky.onrender.com

  - type: web
    name: openclaw-saas
    runtime: static
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/openclaw-saas run build
    staticPublishPath: artifacts/openclaw-saas/dist/public
    envVars:
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      # Proxy URL must point to the actual deployed API service URL + /api/__clerk
      # This tells ClerkProvider to route all FAPI calls through your own backend,
      # which forwards them to Clerk with the correct Clerk-Proxy-Url header.
      # IMPORTANT: replace the hostname below with your actual openclaw-api Render URL.
      #
      # AUDIT (Sprint A, 2026-07): HANDOFF_integration_agent.md §1.1 lists
      # `openclaw-api-k30t.onrender.com` as the canonical API deploy, while
      # this file still points the frontend at `openclaw-api-b9wb`. These
      # must be reconciled in the Render dashboard before merging. The
      # Agent Robustness page will fetch from whichever VITE_API_URL is set
      # at build time — `/api/stress-benchmarks/*` is served by openclaw-api
      # only.
      - key: VITE_CLERK_PROXY_URL
        value: https://openclaw-api-b9wb.onrender.com/api/__clerk
      - key: VITE_API_URL
        value: https://openclaw-api-b9wb.onrender.com
      - key: VITE_ZOA_SERVICE_URL
        value: https://openclaw-benchmark.onrender.com/api/v1/zoa
      - key: VITE_ARCHON_FACTORY_URL
        value: https://archon-factory.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-store
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # AUDIT (Sprint A, 2026-07): NOT CURRENTLY DEPLOYED. The FastAPI service
  # under `backend/` was intended to host L1-L4 skill judgment and Kairos
  # execution, but the deploy is offline. Live L1-L4 lives in-process on
  # `openclaw-api` (`src/lib/archon/*`); Agent Robustness observability
  # lives in-process at `/api/stress-benchmarks/*`. This block is retained
  # so the service can be redeployed later without reconstructing the
  # config from scratch.
  - type: web
    name: openclaw-benchmark
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    rootDir: backend
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: zeta-caid-prod
          property: connectionString

  # AUDIT (Sprint A, 2026-07): LEGACY / NOT REQUIRED AT RUNTIME. Canonical
  # Archon runs in-process inside `openclaw-api` (`src/lib/archon/*`, routes
  # mounted at `/api/archon/*`). Retained here for the future split-out
  # architecture; safe to leave un-deployed today.
  - type: web
    name: archon-factory
    runtime: node
    region: oregon
    plan: starter
    buildCommand: pnpm install && pnpm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    rootDir: packages/archon-factory
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3002"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BENCHMARK_SERVICE_URL
        value: https://openclaw-benchmark.onrender.com
      - key: OPENCLAW_API_URL
        value: https://openclaw-api-b9wb.onrender.com
      - key: ARCHON_SERVICE_URL
        value: https://archon-zeta.onrender.com

databases:
  - name: zeta-caid-prod
    plan: free
    region: oregon
