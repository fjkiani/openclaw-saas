services:
  - type: web
    name: openclaw-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm run typecheck:libs && pnpm --filter @workspace/api-server run build
    startCommand: bash scripts/start-api-with-evidence.sh
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: zeta-caid-prod
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_OWNER_ID
        sync: false
      - key: BENCHMARK_SERVICE_URL
        value: https://openclaw-benchmark.onrender.com
      - key: BENCHMARK_GATE_ENABLED
        value: "true"
      - key: KAIROS_SERVICE_URL
        value: https://openclaw-benchmark.onrender.com
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY_2
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: DRY_RUN
        value: "true"
      - key: OPENCLAW_SERVICE_TOKEN
        sync: false
      - key: EVIDENCE_SERVICE_TOKEN
        sync: false
      # CORS: set to the exact URL of the openclaw-saas static site on Render
      - key: FRONTEND_URL
        value: https://openclaw-lfky.onrender.com

  - type: web
    name: openclaw-saas
    runtime: static
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/openclaw-saas run build
    staticPublishPath: artifacts/openclaw-saas/dist/public
    envVars:
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      # Proxy URL must point to the actual deployed API service URL + /api/__clerk
      # This tells ClerkProvider to route all FAPI calls through your own backend,
      # which forwards them to Clerk with the correct Clerk-Proxy-Url header.
      # IMPORTANT: replace the hostname below with your actual openclaw-api Render URL.
      - key: VITE_CLERK_PROXY_URL
        value: https://openclaw-api-b9wb.onrender.com/api/__clerk
      - key: VITE_API_URL
        value: https://openclaw-api-b9wb.onrender.com
      - key: VITE_ZOA_SERVICE_URL
        value: https://openclaw-benchmark.onrender.com/api/v1/zoa
      - key: VITE_ARCHON_FACTORY_URL
        value: https://archon-factory.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-store
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: openclaw-benchmark
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    rootDir: backend
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: zeta-caid-prod
          property: connectionString

  - type: web
    name: archon-factory
    runtime: node
    region: oregon
    plan: starter
    buildCommand: pnpm install && pnpm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    rootDir: packages/archon-factory
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3002"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BENCHMARK_SERVICE_URL
        value: https://openclaw-benchmark.onrender.com
      - key: OPENCLAW_API_URL
        value: https://openclaw-api-b9wb.onrender.com
      - key: ARCHON_SERVICE_URL
        value: https://archon-zeta.onrender.com

databases:
  - name: zeta-caid-prod
    plan: free
    region: oregon
