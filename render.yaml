services:
  - type: web
    name: openclaw-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: NODE_ENV=development pnpm install --no-frozen-lockfile && pnpm run typecheck:libs && pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: zeta-caid-prod
          property: connectionString
      - key: OPENCLAW_ADMIN_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: JUDGE_NO_CACHE
        value: "1"
      - key: MCP_BENCH_DRY_RUN
        value: "0"
      - key: LEGAL_CORPUS_BOOT_SEED
        value: "true"
      - key: DRY_RUN
        value: "false"
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: openclaw-saas
    runtime: static
    region: oregon
    plan: free
    buildCommand: NODE_ENV=development pnpm install --no-frozen-lockfile && pnpm --filter @workspace/openclaw-saas run build
    staticPublishPath: artifacts/openclaw-saas/dist/public
    envVars:
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-store
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: zeta-caid-prod
    plan: free
    region: oregon
