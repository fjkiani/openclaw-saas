openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: OpenClaw SaaS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tenants
    description: Agent tenant management
  - name: skills
    description: Skill catalog and installation
  - name: dashboard
    description: Dashboard summaries and activity
  - name: billing
    description: Billing and plan management
  - name: connectors
    description: Connector registry and per-tenant connector management
  - name: graphs
    description: Knowledge graph management and document ingestion
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List all agent instances for current user
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Provision a new agent instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantBody"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/{id}:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get a tenant by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
    patch:
      operationId: updateTenant
      tags: [tenants]
      summary: Update a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantBody"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
    delete:
      operationId: deleteTenant
      tags: [tenants]
      summary: Delete a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tenants/{id}/start:
    post:
      operationId: startTenant
      tags: [tenants]
      summary: Start an agent instance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/{id}/stop:
    post:
      operationId: stopTenant
      tags: [tenants]
      summary: Stop a running agent instance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/{id}/skills:
    get:
      operationId: listTenantSkills
      tags: [tenants]
      summary: List skills installed on a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of installed skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantSkill"
    post:
      operationId: installSkillOnTenant
      tags: [tenants]
      summary: Install a skill on a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallSkillBody"
      responses:
        "201":
          description: Skill installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSkill"

  /tenants/{id}/skills/{skillId}:
    delete:
      operationId: uninstallSkillFromTenant
      tags: [tenants]
      summary: Uninstall a skill from a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: skillId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Skill uninstalled

  /tenants/{id}/chat:
    get:
      operationId: getChatHistory
      tags: [tenants]
      summary: Get chat history for a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendChatMessage
      tags: [tenants]
      summary: Send a chat message to the agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatMessageBody"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "409":
          description: Agent not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /tenants/{id}/activity:
    get:
      operationId: getTenantActivity
      tags: [tenants]
      summary: Get recent activity log for a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEntry"

  /connectors:
    get:
      operationId: listConnectorRegistry
      tags: [connectors]
      summary: List all available connector types
      responses:
        "200":
          description: Available connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectorDef"

  /tenants/{id}/connectors:
    get:
      operationId: listTenantConnectors
      tags: [connectors]
      summary: List connectors installed on a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Installed connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantConnector"
    post:
      operationId: installConnectorOnTenant
      tags: [connectors]
      summary: Install a connector and store encrypted credential
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallConnectorBody"
      responses:
        "201":
          description: Connector installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantConnector"

  /tenants/{id}/connectors/{connectorId}:
    delete:
      operationId: removeConnectorFromTenant
      tags: [connectors]
      summary: Remove a connector from a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: connectorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /tenants/{id}/graphs:
    get:
      operationId: listKnowledgeGraphs
      tags: [graphs]
      summary: List knowledge graphs for a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Knowledge graphs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeGraph"
    post:
      operationId: createKnowledgeGraph
      tags: [graphs]
      summary: Create a new knowledge graph
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeGraphBody"
      responses:
        "201":
          description: Graph created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeGraph"

  /tenants/{id}/graphs/{graphId}:
    delete:
      operationId: deleteKnowledgeGraph
      tags: [graphs]
      summary: Delete a knowledge graph and all its documents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: graphId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tenants/{id}/graphs/{graphId}/documents:
    get:
      operationId: listGraphDocuments
      tags: [graphs]
      summary: List documents in a knowledge graph
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: graphId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GraphDocument"

  /tenants/{id}/graphs/{graphId}/query:
    post:
      operationId: queryKnowledgeGraph
      tags: [graphs]
      summary: Full-text search against a knowledge graph
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: graphId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphQueryBody"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphQueryResult"

  /skills:
    get:
      operationId: listSkills
      tags: [skills]
      summary: Browse skill catalog
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Skill catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"

  /skills/featured:
    get:
      operationId: listFeaturedSkills
      tags: [skills]
      summary: Get featured and trending skill packs
      responses:
        "200":
          description: Featured skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"

  /skills/categories:
    get:
      operationId: listSkillCategories
      tags: [skills]
      summary: Get all skill categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillCategory"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /billing/plan:
    get:
      operationId: getBillingPlan
      tags: [billing]
      summary: Get current billing plan and limits
      responses:
        "200":
          description: Billing plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPlan"

  /billing/usage:
    get:
      operationId: getBillingUsage
      tags: [billing]
      summary: Get current usage statistics
      responses:
        "200":
          description: Usage stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingUsage"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Tenant:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [provisioning, running, stopped, error]
        skillPack:
          type: ["string", "null"]
        agentCount:
          type: integer
        memoryUsedKb:
          type: integer
        wsEndpoint:
          type: ["string", "null"]
        gatewayToken:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, userId, name, status, agentCount, memoryUsedKb, createdAt, updatedAt]

    CreateTenantBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        skillPack:
          type: ["string", "null"]
      required: [name]

    UpdateTenantBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]

    TenantSkill:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        skillId:
          type: integer
        skillName:
          type: string
        skillSlug:
          type: string
        category:
          type: string
        installedAt:
          type: string
      required: [id, tenantId, skillId, skillName, skillSlug, category, installedAt]

    InstallSkillBody:
      type: object
      properties:
        skillId:
          type: integer
      required: [skillId]

    ActivityEntry:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        type:
          type: string
          enum: [agent_started, agent_stopped, skill_installed, skill_uninstalled, task_completed, error]
        message:
          type: string
        createdAt:
          type: string
      required: [id, tenantId, type, message, createdAt]

    Skill:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        category:
          type: string
        stars:
          type: integer
        installs:
          type: integer
        featured:
          type: boolean
        tags:
          type: array
          items:
            type: string
      required: [id, name, slug, description, category, stars, installs, featured, tags]

    SkillCategory:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        count:
          type: integer
      required: [name, slug, count]

    DashboardSummary:
      type: object
      properties:
        totalAgents:
          type: integer
        runningAgents:
          type: integer
        totalSkillsInstalled:
          type: integer
        totalTasksCompleted:
          type: integer
        planName:
          type: string
        agentLimit:
          type: integer
      required: [totalAgents, runningAgents, totalSkillsInstalled, totalTasksCompleted, planName, agentLimit]

    BillingPlan:
      type: object
      properties:
        name:
          type: string
          enum: [free, pro, enterprise]
        agentLimit:
          type: integer
        priceMonthly:
          type: number
        features:
          type: array
          items:
            type: string
      required: [name, agentLimit, priceMonthly, features]

    BillingUsage:
      type: object
      properties:
        agentsUsed:
          type: integer
        agentLimit:
          type: integer
        skillsInstalled:
          type: integer
        tasksThisMonth:
          type: integer
        periodStart:
          type: string
        periodEnd:
          type: string
      required: [agentsUsed, agentLimit, skillsInstalled, tasksThisMonth, periodStart, periodEnd]

    ChatMessage:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        role:
          type: string
          enum: [user, assistant, error]
        content:
          type: string
        createdAt:
          type: string
      required: [id, tenantId, role, content, createdAt]

    SendChatMessageBody:
      type: object
      properties:
        message:
          type: string
      required: [message]

    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

    ConnectorDef:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        authType:
          type: string
          enum: [api_key, oauth2]
        credentialLabel:
          type: string
        category:
          type: string
        createdAt:
          type: string
      required: [id, slug, name, description, authType, credentialLabel, category, createdAt]

    TenantConnector:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        connectorId:
          type: integer
        connectorSlug:
          type: string
        connectorName:
          type: string
        verified:
          type: boolean
        createdAt:
          type: string
      required: [id, tenantId, connectorId, connectorSlug, connectorName, verified, createdAt]

    InstallConnectorBody:
      type: object
      properties:
        connectorId:
          type: integer
        credential:
          type: string
      required: [connectorId, credential]

    KnowledgeGraph:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        graphType:
          type: string
        documentCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, tenantId, name, graphType, documentCount, createdAt, updatedAt]

    CreateKnowledgeGraphBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        graphType:
          type: string
      required: [name]

    GraphDocument:
      type: object
      properties:
        id:
          type: integer
        graphId:
          type: integer
        filename:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        status:
          type: string
          enum: [processing, ready, error]
        chunkCount:
          type: integer
        errorMessage:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, graphId, filename, mimeType, sizeBytes, status, chunkCount, createdAt, updatedAt]

    GraphQueryBody:
      type: object
      properties:
        query:
          type: string
        limit:
          type: integer
      required: [query]

    GraphQueryResult:
      type: object
      properties:
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/GraphChunk"
        totalFound:
          type: integer
      required: [chunks, totalFound]

    GraphChunk:
      type: object
      properties:
        id:
          type: integer
        documentId:
          type: integer
        chunkIndex:
          type: integer
        content:
          type: string
        rank:
          type: number
      required: [id, documentId, chunkIndex, content, rank]
