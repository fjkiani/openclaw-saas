kind = "web"
previewPath = "/"
title = "OpenClaw SaaS"
version = "1.0.0"
id = "artifacts/openclaw-saas"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25593

[services.development]
run = "pnpm --filter @workspace/openclaw-saas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/openclaw-saas", "run", "build" ]
publicDir = "artifacts/openclaw-saas/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25593"
BASE_PATH = "/"
